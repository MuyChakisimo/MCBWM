server-name=TACZ Test Server

# Used as the server name.

gamemode=creative

force-gamemode=false

difficulty=normal

allow-cheats=true

# ============================================================

# PLAYERS / ACCESS

# ============================================================

max-players=10

online-mode=true

# Recommended for an Internet-accessible private server.

# Make sure your Xbox gamertag and anyone else testing

# are present in allowlist.json.

allow-list=true

# ============================================================

# NETWORK

# ============================================================

server-port=41993

server-portv6=41194

# server-ip=

# Leave empty to bind to all interfaces.

# server-udp-ports=

transport=nethernet

enable-lan-visibility=true

# ============================================================

# WORLD / PERFORMANCE

# ============================================================

# Good baseline for the i7-7700K.

# We can test 12 later after TACZ is optimized.

view-distance=10

# Keep simulation distance at minimum while profiling TACZ.

tick-distance=4

player-idle-timeout=30

# allow-player-joining=true

# 0 allows Bedrock Dedicated Server to use available threads.

max-threads=0

# ============================================================

# WORLD

# ============================================================

level-name=TestIsland

level-seed=100000067850241780

default-player-permission-level=member

# ============================================================

# RESOURCE PACKS

# ============================================================

# TACZ relies on its resource pack, so clients should use it.

texturepack-required=true

# ============================================================

# CONTENT / ADDON LOGGING

# ============================================================

# Keep file logging enabled while TACZ is being optimized.

content-log-file-enabled=true

# On while testing: the TACZ debug report (scriptevent tacz:debug stop) and script errors show in the console.

content-log-console-output-enabled=true

# Report warnings and errors without verbose informational spam.

content-log-level=warning

# ============================================================

# NETWORK COMPRESSION

# ============================================================

# Avoid spending CPU time compressing extremely small packets.

compression-threshold=256

# Lower CPU overhead than zlib; appropriate for this server.

compression-algorithm=snappy

# ============================================================

# SERVER-AUTHORITATIVE MOVEMENT / INTERACTION

# ============================================================

server-authoritative-movement-strict=false

server-authoritative-dismount-strict=false

server-authoritative-entity-interactions-strict=false

player-position-acceptance-threshold=0.5

player-movement-action-direction-threshold=0.85

server-authoritative-block-breaking-pick-range-scalar=1.5

# ============================================================

# CHAT / PLAYER INTERACTION

# ============================================================

chat-restriction=None

disable-player-interaction=false

# ============================================================

# CHUNK GENERATION

# ============================================================

client-side-chunk-generation-enabled=true

block-network-ids-are-hashes=true

disable-persona=false

disable-custom-skins=false

# Let the server dynamically determine how much of the visual

# chunk radius should be generated server-side versus client-side.

server-build-radius-ratio=Disabled

# ============================================================

# SCRIPT DEBUGGER

#

# Leave remote debugger access disabled unless we specifically

# decide to attach Visual Studio Code later.

# ============================================================

allow-outbound-script-debugging=false

allow-inbound-script-debugging=false


script-debugger-auto-attach=disabled


#script-debugger-auto-attach-timeout=0

#script-debugger-passcode=

# ============================================================

# SCRIPT WATCHDOG

#

# These warning values are intentionally stricter than the

# normal defaults while we diagnose TACZ.

# ============================================================

script-watchdog-enable=true

script-watchdog-enable-exception-handling=true

script-watchdog-enable-shutdown=true

script-watchdog-hang-exception=true

# Serious single-tick hang threshold.

script-watchdog-hang-threshold=10000

# Normally 100 ms.

# 50 ms makes script spikes easier for us to detect.

script-watchdog-spike-threshold=50

# Normally 10 ms.

# 5 ms makes consistently expensive scripting easier to detect.

script-watchdog-slow-threshold=5

# Warn if combined script memory exceeds 100 MB.

script-watchdog-memory-warning=100

# Save/shut down if combined script memory exceeds 250 MB.

script-watchdog-memory-limit=250

# ============================================================

# DIAGNOSTICS CAPTURE

# ============================================================

# Do not continuously capture diagnostics.

# We can start captures intentionally when needed.

diagnostics-capture-auto-start=false

diagnostics-capture-max-files=5

diagnostics-capture-max-file-size=2097152

# ============================================================

# CLIENT GRAPHICS

#

# Keep Vibrant Visuals disabled during performance testing.

# This helps separate client rendering problems from TACZ /

# server scripting problems.

# ============================================================

disable-client-vibrant-visuals=true

# ============================================================

# SENTRY

# ============================================================

sentry-rate-limit-window=60

sentry-max-events-per-window=10

# ============================================================

# PROFILING

#

# Enabled while we are diagnosing and optimizing TACZ.

# ============================================================

enable-profiler=true

# ============================================================

# EDITOR / NETWORK METRICS

# ============================================================

# Not needed for normal TACZ gameplay testing.

#enable-editor-network-metrics=true

convert-world-to-editor-project=false
